{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-stats-measurements-chart.fullname" . }}-ingress
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.frontendPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-stats-measurements-chart.frontendName" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
          - path: {{ .Values.ingress.backendPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-stats-measurements-chart.backendName" . }}
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}