apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ai-stats-measurements-chart.postgresName" . }}
spec:
  serviceName: {{ include "ai-stats-measurements-chart.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "ai-stats-measurements-chart.postgresName" . }}
  template:
    metadata:
      labels:
        app: {{ include "ai-stats-measurements-chart.postgresName" . }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
          - name: POSTGRES_DB
            value: {{ .Values.postgres.auth.database | quote }}

          - name: POSTGRES_USER
            value: {{ .Values.postgres.auth.username | quote }}

          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.secretName }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}